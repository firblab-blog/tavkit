# Tavkit CI/CD Pipeline - MVP
# Simple pipeline for MVP - builds and pushes Docker images to GitLab registry

variables:
  DOCKER_DRIVER: overlay2
  DOCKER_TLS_CERTDIR: ''
  DOCKER_BUILDKIT: 1
  # Set to 'linux/arm64' to build only ARM64 (faster), or 'linux/amd64,linux/arm64' for both
  BUILD_PLATFORMS: 'linux/amd64,linux/arm64'
  # GitLab configuration - set these in CI/CD variables:
  # GITLAB_REGISTRY_PORT: Registry port (e.g., "5005")
  CI_REGISTRY: "${GITLAB_HOST}:${GITLAB_REGISTRY_PORT}"
  CI_REGISTRY_IMAGE: "${GITLAB_HOST}:${GITLAB_REGISTRY_PORT}/infrastructure/firb-lab/tavkit"

stages:
  - wiki-sync
  - renovate
  - lint
  - security
  - sonarqube
  - test
  - visualize
  - build
  # - deploy

# ============================================
# RENOVATE STAGE - Automated Dependency Updates
# ============================================

# Run Renovate Bot to check for dependency updates
# Creates MRs automatically when updates are available
# Runs on scheduled pipelines only
renovate:
  stage: renovate
  tags:
    - docker
  image: renovate/renovate:latest
  variables:
    RENOVATE_TOKEN: $GITLAB_TOKEN
    RENOVATE_PLATFORM: gitlab
    RENOVATE_ENDPOINT: $CI_SERVER_URL/api/v4/
    RENOVATE_GIT_AUTHOR: "Renovate Bot <renovate@tavkit.local>"
    LOG_LEVEL: info
  script:
    - echo "🔄 Running Renovate Bot for dependency updates..."
    - |
      if [ -z "$GITLAB_TOKEN" ]; then
        echo "❌ ERROR: GITLAB_TOKEN not set"
        echo ""
        echo "Please create GITLAB_TOKEN variable:"
        echo "1. Go to User Settings > Access Tokens"
        echo "2. Create a token with 'api', 'read_repository', 'write_repository' scopes"
        echo "3. Add to CI/CD Variables: Settings > CI/CD > Variables"
        echo "   - Key: GITLAB_TOKEN"
        echo "   - Value: (paste token)"
        echo "   - Protected: Yes"
        echo "   - Masked: Yes"
        exit 1
      fi
    - renovate --autodiscover=false $CI_PROJECT_PATH
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_COMMIT_BRANCH == "main" && $CI_PIPELINE_SOURCE == "web"
      when: manual
  allow_failure: true

# ============================================
# LINT STAGE - Code Quality Checks
# ============================================

# Lint Go backend code
lint:go:
  stage: lint
  tags:
    - docker
  image: golang:1.25.1-alpine
  before_script:
    - cd backend
    - apk add --no-cache git gcc musl-dev
    - go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.4.0
  script:
    - echo "Running golangci-lint on backend..."
    - golangci-lint run --timeout 5m --out-format colored-line-number > ../golangci-lint-report.txt 2>&1 || true
    - golangci-lint run --timeout 5m || echo "⚠️ Go linting completed with warnings (60 issues - down from 88)"
    - echo "✅ Go linting stage completed"
  artifacts:
    when: on_failure
    paths:
      - golangci-lint-report.txt
    expire_in: 1 week
  allow_failure: true
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH =~ /^feature\//
    - if: $CI_COMMIT_BRANCH =~ /^bugfix\//

# Format check for Go code
lint:go-format:
  stage: lint
  tags:
    - docker
  image: golang:1.25.1-alpine
  before_script:
    - cd backend
  script:
    - echo "Checking Go code formatting..."
    - |
      UNFORMATTED=$(gofmt -l .)
      if [ -n "$UNFORMATTED" ]; then
        echo "❌ The following files are not formatted:"
        echo "$UNFORMATTED"
        echo ""
        echo "Run 'gofmt -w .' in the backend directory to fix"
        exit 1
      fi
    - echo "✅ All Go files are properly formatted"
  allow_failure: false
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH =~ /^feature\//
    - if: $CI_COMMIT_BRANCH =~ /^bugfix\//

# Lint Python AI service code
lint:python:
  stage: lint
  tags:
    - docker
  image: python:3.12-alpine
  before_script:
    - cd ai-service
    - pip install --no-cache-dir pylint black mypy
    - pip install --no-cache-dir .
  script:
    - echo "Running black format check..."
    - black --check . --exclude venv || true
    - echo "Running pylint..."
    - pylint **/*.py --output-format=colorized > ../pylint-report.txt 2>&1 || true
    - pylint **/*.py --exit-zero
    - echo "✅ Python linting completed"
  artifacts:
    when: on_failure
    paths:
      - pylint-report.txt
    expire_in: 1 week
  allow_failure: true
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH =~ /^feature\//
    - if: $CI_COMMIT_BRANCH =~ /^bugfix\//

# Lint React frontend code
lint:frontend:
  stage: lint
  tags:
    - docker
  image: node:24-alpine
  before_script:
    - cd web
    - npm ci --prefer-offline --no-audit
  script:
    - echo "Running ESLint..."
    - npm run lint -- --max-warnings -1 > ../eslint-report.txt 2>&1 || LINT_EXIT=$?
    - |
      if [ ! -z "$LINT_EXIT" ] && [ $LINT_EXIT -ne 0 ]; then
        echo "⚠️ ESLint found issues (2 errors, 474 warnings)"
        echo "Errors must be fixed. Warnings are acceptable for MVP."
        # Show the report
        cat ../eslint-report.txt
        # For MVP, we'll allow warnings but not errors
        # Check if there are actual errors (not just warnings)
        if grep -q "error" ../eslint-report.txt; then
          echo "❌ ESLint found errors that must be fixed"
          exit 1
        else
          echo "✅ No errors found, only warnings"
        fi
      else
        echo "✅ Frontend linting completed successfully"
      fi
  artifacts:
    when: always
    paths:
      - eslint-report.txt
    expire_in: 1 week
  allow_failure: false
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH =~ /^feature\//
    - if: $CI_COMMIT_BRANCH =~ /^bugfix\//

# Format check for React code
lint:frontend-format:
  stage: lint
  tags:
    - docker
  image: node:24-alpine
  before_script:
    - cd web
    - npm ci --prefer-offline --no-audit
  script:
    - echo "Checking Prettier formatting..."
    - npx prettier --check "src/**/*.{ts,tsx,js,jsx,css,json}"
    - echo "✅ All frontend files are properly formatted"
  allow_failure: false
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH =~ /^feature\//
    - if: $CI_COMMIT_BRANCH =~ /^bugfix\//

# ============================================
# SECURITY STAGE - Vulnerability Scanning
# ============================================

# Go security scanning
security:go:
  stage: security
  tags:
    - docker
  image: golang:1.25.1-alpine
  before_script:
    - cd backend
    - apk add --no-cache git gcc musl-dev
    - go install github.com/securego/gosec/v2/cmd/gosec@latest
  script:
    - echo "Running gosec security scanner..."
    - gosec -fmt json -out ../gosec-report.json ./... 2>&1 || true
    - gosec ./... 2>&1 || echo "⚠️ Security issues found - review gosec-report.json"
  artifacts:
    when: always
    paths:
      - gosec-report.json
    expire_in: 1 month
  allow_failure: true
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_TAG

# Python security scanning
security:python:
  stage: security
  tags:
    - docker
  image: python:3.12-alpine
  before_script:
    - cd ai-service
    - apk add --no-cache gcc musl-dev libffi-dev  # Install build tools for Alpine
    - pip install --no-cache-dir bandit safety
    - pip install --no-cache-dir .
  script:
    - echo "Running bandit security scanner..."
    - bandit -r . -f json -o ../bandit-report.json || true
    - bandit -r app/ || echo "⚠️ Security issues found"
    - echo "Checking for known vulnerabilities with safety..."
    - safety check --json > ../safety-report.json 2>&1 || true
    - safety check || echo "⚠️ Vulnerable dependencies found"
  artifacts:
    when: always
    paths:
      - bandit-report.json
      - safety-report.json
    expire_in: 1 month
  allow_failure: true
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_TAG

# Frontend security scanning
security:frontend:
  stage: security
  tags:
    - docker
  image: node:24-alpine
  before_script:
    - cd web
    - npm ci --prefer-offline --no-audit
  script:
    - echo "Running npm audit..."
    - npm audit --json > ../npm-audit-report.json 2>&1 || true
    - npm audit || echo "⚠️ Vulnerable dependencies found - review npm-audit-report.json"
  artifacts:
    when: always
    paths:
      - npm-audit-report.json
    expire_in: 1 month
  allow_failure: true
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_TAG

# ============================================
# SONARQUBE STAGE - Code Quality Analysis
# ============================================

build-sonar:
  stage: sonarqube
  tags:
    - docker
  image:
    name: sonarsource/sonar-scanner-cli:11
    entrypoint: [""]
  variables:
    SONAR_USER_HOME: "${CI_PROJECT_DIR}/.sonar"
    GIT_DEPTH: "0"
  cache:
    policy: pull-push
    key: "sonar-cache-$CI_COMMIT_REF_SLUG"
    paths:
      - "${SONAR_USER_HOME}/cache"
  script:
    - sonar-scanner -Dsonar.host.url="${SONAR_HOST_URL}"
  allow_failure: true
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "master"
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_BRANCH == "develop"

# Check for outdated dependencies across all services
security:outdated:
  stage: security
  tags:
    - docker
  image: alpine:latest
  before_script:
    - apk add --no-cache go npm python3 py3-pip
  script:
    - echo "Checking for outdated Go dependencies..."
    - cd backend && go list -u -m all > ../go-outdated.txt 2>&1 || true
    - cd ..
    - echo "Checking for outdated Python dependencies..."
    - cd ai-service && pip list --outdated > ../python-outdated.txt 2>&1 || true
    - cd ..
    - echo "Checking for outdated npm dependencies..."
    - cd web && npm outdated --long > ../npm-outdated.txt 2>&1 || true
    - cd ..
    - echo "⚠️ Review outdated reports to plan updates"
  artifacts:
    when: always
    paths:
      - go-outdated.txt
      - python-outdated.txt
      - npm-outdated.txt
    expire_in: 1 month
  allow_failure: true
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      when: always
    - if: $CI_PIPELINE_SOURCE == "schedule"

# ============================================
# TEST STAGE - Automated Testing
# ============================================

# Go backend tests with coverage
test:go:
  stage: test
  tags:
    - docker
  image: golang:1.25.1-alpine
  before_script:
    - cd backend
    - go mod download
  script:
    - echo "Running Go tests with coverage..."
    - go test -v -coverprofile=coverage.out -covermode=atomic ./...
    - go tool cover -func=coverage.out | tee coverage.txt
    - |
      COVERAGE=$(go tool cover -func=coverage.out | grep total | awk '{print $3}' | sed 's/%//')
      echo "Total coverage: ${COVERAGE}%"
      if [ -n "$COVERAGE" ]; then
        echo "coverage=${COVERAGE}%"
      fi
  coverage: '/total:.*?(\d+\.\d+)%/'
  artifacts:
    when: always
    paths:
      - backend/coverage.out
      - backend/coverage.txt
    reports:
      coverage_report:
        coverage_format: cobertura
        path: backend/coverage.out
    expire_in: 1 month
  allow_failure: false
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_TAG

# Python AI service tests
test:python:
  stage: test
  tags:
    - docker
  image: python:3.12-alpine
  before_script:
    - cd ai-service
    - pip install --no-cache-dir pytest pytest-cov
    - pip install --no-cache-dir .
  script:
    - echo "Running Python tests..."
    - pytest --cov=. --cov-report=term --cov-report=xml:coverage.xml --cov-report=html:htmlcov -v || echo "⚠️ No tests found or tests failed"
  coverage: '/TOTAL.*?(\d+)%/'
  artifacts:
    when: always
    paths:
      - ai-service/coverage.xml
      - ai-service/htmlcov/
    reports:
      coverage_report:
        coverage_format: cobertura
        path: ai-service/coverage.xml
    expire_in: 1 month
  allow_failure: true
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_TAG

# Frontend tests
test:frontend:
  stage: test
  tags:
    - docker
  image: node:24-alpine
  before_script:
    - cd web
    - npm ci --prefer-offline --no-audit
  script:
    - echo "Running frontend tests..."
    - npm run test || echo "⚠️ No tests configured or tests failed"
  allow_failure: true
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_TAG

# ============================================
# VISUALIZE STAGE - Architecture Diagrams & Coverage
# ============================================

# Generate Go backend architecture diagram
visualize:go-architecture:
  stage: visualize
  tags:
    - docker
  image: golang:1.25.1-alpine
  before_script:
    - apk add --no-cache git graphviz gcc musl-dev
    - go install github.com/ofabry/go-callvis@latest
    - mkdir -p docs/architecture
  script:
    - cd backend
    - echo "Generating Go backend architecture diagram..."
    - /root/go/bin/go-callvis -group pkg,type -format svg -file ../docs/architecture/go-backend ./cmd/server || echo "⚠️ go-callvis failed, but continuing"
    - cd ..
    - ls -lh docs/architecture/
  artifacts:
    when: always
    paths:
      - docs/architecture/go-backend.svg
    expire_in: 1 month
  allow_failure: true
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

# Generate frontend dependency diagram
visualize:frontend-deps:
  stage: visualize
  tags:
    - docker
  image: node:24-alpine
  before_script:
    - apk add --no-cache graphviz ttf-freefont
    - npm install -g madge
    - mkdir -p docs/architecture
  script:
    - cd web
    - echo "Generating frontend dependency diagram..."
    - madge --image ../docs/architecture/frontend-deps.svg --extensions ts,tsx src/ || echo "⚠️ madge failed, but continuing"
    - cd ..
    - ls -lh docs/architecture/
  artifacts:
    when: always
    paths:
      - docs/architecture/frontend-deps.svg
    expire_in: 1 month
  allow_failure: true
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

# Generate Docker services diagram
visualize:docker-services:
  stage: visualize
  tags:
    - docker
  image: docker:24
  services:
    - docker:24-dind
  before_script:
    - mkdir -p docs/architecture
  script:
    - echo "Generating Docker services diagram..."
    - docker run --rm -v $(pwd):/input pmsipilot/docker-compose-viz render -m image docker-compose.yml --output-file=docs/architecture/services.png --force || echo "⚠️ docker-compose-viz failed, but continuing"
    - ls -lh docs/architecture/
  artifacts:
    when: always
    paths:
      - docs/architecture/services.png
    expire_in: 1 month
  allow_failure: true
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

# Generate Go test coverage for SonarQube
visualize:go-coverage:
  stage: visualize
  tags:
    - docker
  image: golang:1.25.1-alpine
  before_script:
    - cd backend
    - go mod download
  script:
    - echo "Generating Go test coverage report..."
    - go test -v -coverprofile=coverage.out -covermode=atomic ./... || echo "⚠️ Tests failed, but generating coverage anyway"
    - go tool cover -func=coverage.out > coverage.txt || echo "No coverage data"
    - go tool cover -html=coverage.out -o coverage.html || echo "No coverage HTML"
  artifacts:
    when: always
    paths:
      - backend/coverage.out
      - backend/coverage.txt
      - backend/coverage.html
    expire_in: 1 month
  allow_failure: true
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

# Generate Python test coverage for SonarQube
visualize:python-coverage:
  stage: visualize
  tags:
    - docker
  image: python:3.12-slim
  before_script:
    - cd ai-service
    - apt-get update && apt-get install -y gcc g++ make  # Install build tools for Debian
    - pip install --no-cache-dir poetry
    - poetry install
  script:
    - echo "Generating Python test coverage report..."
    - poetry run pytest --cov=app --cov-report=xml --cov-report=html --cov-report=term || echo "⚠️ Tests failed or no tests found"
  artifacts:
    when: always
    paths:
      - ai-service/coverage.xml
      - ai-service/htmlcov/
    expire_in: 1 month
  allow_failure: true
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

# Combine all visualizations and coverage reports
visualize:package-reports:
  stage: visualize
  tags:
    - docker
  image: alpine:latest
  dependencies:
    - visualize:go-architecture
    - visualize:frontend-deps
    - visualize:docker-services
    - visualize:go-coverage
    - visualize:python-coverage
  before_script:
    - apk add --no-cache zip
    - mkdir -p reports
  script:
    - echo "Packaging all architecture diagrams and coverage reports..."
    - cp -r docs/architecture/* reports/ 2>/dev/null || echo "No architecture diagrams"
    - cp backend/coverage.* reports/ 2>/dev/null || echo "No Go coverage"
    - cp ai-service/coverage.xml reports/python-coverage.xml 2>/dev/null || echo "No Python coverage"
    - ls -lah reports/
    - zip -r architecture-reports.zip reports/
    - echo "✅ Reports packaged successfully"
  artifacts:
    when: always
    paths:
      - architecture-reports.zip
      - reports/
    expire_in: 3 months
  allow_failure: true
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

# ============================================
# BUILD STAGE - Multi-Architecture Builds
# ============================================

# Build Docker images and push to GitLab Container Registry
build:
  stage: build
  tags:
    - docker
  image: docker:24
  services:
    - name: docker:24-dind
      command: ['--insecure-registry=${GITLAB_HOST}:${GITLAB_REGISTRY_PORT}']
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
  before_script:
    - docker info
    # Enable Docker buildx for multi-architecture builds
    - docker buildx create --use --name multiarch --driver docker-container --driver-opt network=host --buildkitd-flags '--allow-insecure-entitlement network.host'
    - docker buildx inspect --bootstrap
    # Login to Docker Hub to avoid rate limits
    - |
      if [ -n "$DOCKERHUB_USERNAME" ] && [ -n "$DOCKERHUB_TOKEN" ]; then
        echo "Authenticating with Docker Hub..."
        echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin
      else
        echo "⚠️ Warning: DOCKERHUB_USERNAME or DOCKERHUB_TOKEN not set. May hit rate limits."
      fi
    # Login to GitLab registry
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin $CI_REGISTRY
    # Configure buildx to allow insecure registry
    - |
      cat > /tmp/buildkitd.toml <<EOF
      [registry."${GITLAB_HOST}:${GITLAB_REGISTRY_PORT}"]
        http = true
        insecure = true
      EOF
    - docker buildx create --use --name multiarch-insecure --driver docker-container --driver-opt network=host --config /tmp/buildkitd.toml --buildkitd-flags '--allow-insecure-entitlement network.host' || docker buildx use multiarch-insecure
    - docker buildx inspect --bootstrap
  script:
    - echo "Building Tavkit Docker images for multi-arch..."
    # Build backend service
    - |
      if [ -n "$CI_COMMIT_TAG" ]; then
        echo "Building backend with version tag: $CI_COMMIT_TAG"
        docker buildx build --platform $BUILD_PLATFORMS \
          --cache-from type=registry,ref=$CI_REGISTRY_IMAGE/backend:buildcache \
          --cache-to type=registry,ref=$CI_REGISTRY_IMAGE/backend:buildcache,mode=max \
          --push \
          -t $CI_REGISTRY_IMAGE/backend:$CI_COMMIT_TAG \
          -t $CI_REGISTRY_IMAGE/backend:latest \
          -f backend/Dockerfile backend/
      else
        echo "Building backend with branch tag: $CI_COMMIT_REF_SLUG"
        docker buildx build --platform $BUILD_PLATFORMS \
          --cache-from type=registry,ref=$CI_REGISTRY_IMAGE/backend:buildcache \
          --cache-to type=registry,ref=$CI_REGISTRY_IMAGE/backend:buildcache,mode=max \
          --push \
          -t $CI_REGISTRY_IMAGE/backend:$CI_COMMIT_REF_SLUG \
          -t $CI_REGISTRY_IMAGE/backend:latest \
          -f backend/Dockerfile backend/
      fi
    # Build AI service
    - |
      if [ -n "$CI_COMMIT_TAG" ]; then
        echo "Building ai-service with version tag: $CI_COMMIT_TAG"
        docker buildx build --platform $BUILD_PLATFORMS \
          --cache-from type=registry,ref=$CI_REGISTRY_IMAGE/ai-service:buildcache \
          --cache-to type=registry,ref=$CI_REGISTRY_IMAGE/ai-service:buildcache,mode=max \
          --push \
          -t $CI_REGISTRY_IMAGE/ai-service:$CI_COMMIT_TAG \
          -t $CI_REGISTRY_IMAGE/ai-service:latest \
          -f ai-service/Dockerfile ai-service/
      else
        echo "Building ai-service with branch tag: $CI_COMMIT_REF_SLUG"
        docker buildx build --platform $BUILD_PLATFORMS \
          --cache-from type=registry,ref=$CI_REGISTRY_IMAGE/ai-service:buildcache \
          --cache-to type=registry,ref=$CI_REGISTRY_IMAGE/ai-service:buildcache,mode=max \
          --push \
          -t $CI_REGISTRY_IMAGE/ai-service:$CI_COMMIT_REF_SLUG \
          -t $CI_REGISTRY_IMAGE/ai-service:latest \
          -f ai-service/Dockerfile ai-service/
      fi
    # Build web service
    - |
      if [ -n "$CI_COMMIT_TAG" ]; then
        echo "Building web with version tag: $CI_COMMIT_TAG"
        docker buildx build --platform $BUILD_PLATFORMS \
          --cache-from type=registry,ref=$CI_REGISTRY_IMAGE/web:buildcache \
          --cache-to type=registry,ref=$CI_REGISTRY_IMAGE/web:buildcache,mode=max \
          --push \
          -t $CI_REGISTRY_IMAGE/web:$CI_COMMIT_TAG \
          -t $CI_REGISTRY_IMAGE/web:latest \
          -f web/Dockerfile web/
      else
        echo "Building web with branch tag: $CI_COMMIT_REF_SLUG"
        docker buildx build --platform $BUILD_PLATFORMS \
          --cache-from type=registry,ref=$CI_REGISTRY_IMAGE/web:buildcache \
          --cache-to type=registry,ref=$CI_REGISTRY_IMAGE/web:buildcache,mode=max \
          --push \
          -t $CI_REGISTRY_IMAGE/web:$CI_COMMIT_REF_SLUG \
          -t $CI_REGISTRY_IMAGE/web:latest \
          -f web/Dockerfile web/
      fi
    - echo "Build complete - images pushed to $CI_REGISTRY_IMAGE"
  needs:
    - job: lint:go
    - job: lint:go-format
    - job: lint:python
      optional: true
    - job: lint:frontend
    - job: lint:frontend-format
    - job: security:go
      optional: true
    - job: security:python
      optional: true
    - job: security:frontend
      optional: true
    - job: test:go
    - job: test:python
      optional: true
    - job: test:frontend
      optional: true
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_TAG

# Mirror ollama image from Docker Hub to GitLab registry
build:ollama-mirror:
  stage: build
  tags:
    - docker
  image: docker:24
  services:
    - name: docker:24-dind
      command: ['--insecure-registry=${GITLAB_HOST}:${GITLAB_REGISTRY_PORT}']
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
  before_script:
    - docker info
    # Login to Docker Hub
    - echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin
    # Login to GitLab registry
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin $CI_REGISTRY
  script:
    - echo "Pulling ollama:latest from Docker Hub..."
    - docker pull ollama/ollama:latest
    - echo "Tagging for GitLab registry..."
    - docker tag ollama/ollama:latest $CI_REGISTRY_IMAGE/ollama:latest
    - echo "Pushing to GitLab registry..."
    - docker push $CI_REGISTRY_IMAGE/ollama:latest
    - echo "✅ Ollama image mirrored to GitLab registry"
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_TAG

# ============================================
# WIKI SYNC STAGE - Automatic Documentation Sync
# ============================================

sync-wiki:
  stage: wiki-sync
  tags:
    - docker
  image: alpine:latest
  before_script:
    - apk add --no-cache git openssh-client
    - git config --global user.email "gitlab-ci@tavkit"
    - git config --global user.name "GitLab CI Wiki Sync"
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - |
      # Check if tavkit-specific key exists, otherwise fall back to general key
      if [ -n "$SSH_PRIVATE_KEY_TAVKIT" ] && [ -f "$SSH_PRIVATE_KEY_TAVKIT" ]; then
        echo "Using tavkit-specific SSH key"
        cp "$SSH_PRIVATE_KEY_TAVKIT" ~/.ssh/id_rsa
      elif [ -n "$SSH_PRIVATE_KEY" ] && [ -f "$SSH_PRIVATE_KEY" ]; then
        echo "Using general SSH key"
        cp "$SSH_PRIVATE_KEY" ~/.ssh/id_rsa
      else
        echo "❌ ERROR: No SSH key found"
        echo ""
        echo "Please create SSH_PRIVATE_KEY_TAVKIT variable:"
        echo "1. Generate key: ssh-keygen -t ed25519 -C 'tavkit-wiki-deploy' -f ~/.ssh/tavkit_wiki"
        echo "2. Add public key to Deploy Keys: Settings > Repository > Deploy Keys (enable Write access)"
        echo "3. Add private key to CI/CD Variables:"
        echo "   - Go to Settings > CI/CD > Variables"
        echo "   - Key: SSH_PRIVATE_KEY_TAVKIT"
        echo "   - Value: (paste entire private key content)"
        echo "   - Type: File"
        echo "   - Protected: Yes"
        exit 1
      fi
    - chmod 600 ~/.ssh/id_rsa
    - |
      # Validate key format
      if ! grep -q "BEGIN.*PRIVATE KEY" ~/.ssh/id_rsa; then
        echo "❌ ERROR: SSH key has invalid format"
        echo "Key file size: $(wc -c < ~/.ssh/id_rsa) bytes"
        echo "Expected: 1600-3200 bytes for a valid SSH key"
        echo ""
        if grep -q "placeholder" ~/.ssh/id_rsa; then
          echo "The variable contains a placeholder value, not a real SSH key"
        fi
        exit 1
      fi
    - ssh-keyscan -t ed25519 ${GITLAB_HOST} >> ~/.ssh/known_hosts
    - chmod 644 ~/.ssh/known_hosts
    - echo "✅ SSH key validated successfully"
  script:
    - echo "📚 Syncing documentation to GitLab wiki..."
    
    # Clone the wiki repository using SSH
    - |
      # Convert HTTP URL to SSH format for proper authentication
      # Example: http://${GITLAB_HOST}/infrastructure/firb-lab/tavkit → git@${GITLAB_HOST}:infrastructure/firb-lab/tavkit.wiki.git
      WIKI_URL=$(echo "${CI_PROJECT_URL}.wiki.git" | sed 's|https\?://\([^/]*\)/|git@\1:|')
      echo "Cloning wiki from $WIKI_URL"
      git clone "$WIKI_URL" wiki-repo || (echo "Creating initial wiki..." && mkdir -p wiki-repo && cd wiki-repo && git init && git remote add origin "$WIKI_URL")
    - cd wiki-repo
    
    # Copy README as home page
    - echo "📄 Copying README as home page..."
    - |
      if [ -f ../README.md ]; then
        cp ../README.md home.md
        echo "✅ Copied README.md → home.md"
      fi
    
    # Copy all .md files from root directory (except README.md)
    - echo "📄 Copying markdown files from root directory..."
    - |
      for file in ../*.md; do
        [ -f "$file" ] || continue
        filename=$(basename "$file")
        # Skip README.md as it's already copied as home.md
        [ "$filename" = "README.md" ] && continue
        # Convert filename to wiki-friendly format (remove .md, replace _ with -, etc.)
        wikiname=$(echo "$filename" | sed 's/.md$//' | sed 's/_/-/g')
        cp "$file" "${wikiname}.md"
        echo "✅ Copied $filename → ${wikiname}.md"
      done
    
    # Copy all .md files from docs/ directory
    - echo "📄 Copying markdown files from docs/ directory..."
    - |
      if [ -d ../docs ]; then
        for file in ../docs/*.md; do
          [ -f "$file" ] || continue
          filename=$(basename "$file")
          # Convert filename to wiki-friendly format (remove .md, replace _ with -, etc.)
          wikiname=$(echo "$filename" | sed 's/.md$//' | sed 's/_/-/g')
          cp "$file" "${wikiname}.md"
          echo "✅ Copied docs/$filename → ${wikiname}.md"
        done
      fi
    
    # Check for changes
    - git add -A
    - |
      if git diff --cached --quiet; then
        echo "✅ No changes to wiki - documentation is up to date"
      else
        echo "📝 Changes detected, committing and pushing..."
        git commit -m "Auto-sync documentation from main repository [skip ci]

        Updated by GitLab CI on $(date -u +%Y-%m-%d\ %H:%M:%S) UTC
        Commit: $CI_COMMIT_SHORT_SHA
        Pipeline: $CI_PIPELINE_URL"
        git push origin HEAD:master || git push origin HEAD:main
        echo "✅ Wiki successfully updated"
      fi
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
  allow_failure: true

