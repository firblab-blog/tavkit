<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <!-- Wood/clay tankard gradient -->
    <linearGradient id="tankardGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#A0826D;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#8B6F47;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6B5644;stop-opacity:1" />
    </linearGradient>
    
    <!-- Foam gradient -->
    <radialGradient id="foamGradient">
      <stop offset="0%" style="stop-color:#FFFAED;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#F5E6D3;stop-opacity:1" />
    </radialGradient>
    
    <!-- Metal band gradient -->
    <linearGradient id="metalGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#D4AF37;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#C9A428;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#B8941F;stop-opacity:1" />
    </linearGradient>
    
    <!-- DM Screen leather gradient -->
    <linearGradient id="leatherGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3D2817;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#4A3428;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3D2817;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  
  <!-- DM Screen (three panels) - angled OUTWARD so tankard is on DM's side -->
  <g id="dmScreen">
    <!-- Left panel (angled outward) -->
    <path d="M 10,50 L 60,40 L 60,170 L 10,180 Z" 
          fill="url(#leatherGradient)" 
          stroke="#2C1810" 
          stroke-width="2"/>
    <!-- Inner border -->
    <path d="M 16,54 L 58,46 L 58,166 L 16,174 Z" 
          fill="none" 
          stroke="#5C4A3A" 
          stroke-width="1.5"/>
    <!-- Panel details -->
    <line x1="18" y1="70" x2="56" y2="64" stroke="#3D2817" stroke-width="0.5" opacity="0.3"/>
    <line x1="18" y1="110" x2="56" y2="104" stroke="#3D2817" stroke-width="0.5" opacity="0.3"/>
    <line x1="18" y1="150" x2="56" y2="144" stroke="#3D2817" stroke-width="0.5" opacity="0.3"/>
    
    <!-- Pinned parchment note 1 -->
    <g>
      <rect x="20" y="75" width="24" height="20" fill="#E8DCC0" stroke="#A0826D" stroke-width="0.5" opacity="0.9"/>
      <!-- Pin/tack -->
      <circle cx="32" cy="77" r="1.5" fill="#4A4A4A"/>
      <!-- Scribbled text lines -->
      <line x1="22" y1="82" x2="40" y2="81" stroke="#3D2817" stroke-width="0.4" opacity="0.6"/>
      <line x1="22" y1="86" x2="38" y2="85" stroke="#3D2817" stroke-width="0.4" opacity="0.6"/>
      <line x1="22" y1="90" x2="41" y2="89" stroke="#3D2817" stroke-width="0.4" opacity="0.6"/>
    </g>
    
    <!-- Pinned parchment note 2 -->
    <g>
      <rect x="24" y="118" width="20" height="24" fill="#F5E6D3" stroke="#A0826D" stroke-width="0.5" opacity="0.85"/>
      <!-- Pin/tack -->
      <circle cx="34" cy="120" r="1.5" fill="#4A4A4A"/>
      <!-- Scribbled text lines -->
      <line x1="26" y1="126" x2="40" y2="126" stroke="#3D2817" stroke-width="0.4" opacity="0.6"/>
      <line x1="26" y1="130" x2="38" y2="130" stroke="#3D2817" stroke-width="0.4" opacity="0.6"/>
      <line x1="26" y1="134" x2="41" y2="134" stroke="#3D2817" stroke-width="0.4" opacity="0.6"/>
      <line x1="26" y1="138" x2="36" y2="138" stroke="#3D2817" stroke-width="0.4" opacity="0.6"/>
    </g>
    
    <!-- Center panel (straight) -->
    <rect x="60" y="40" width="80" height="130" 
          fill="#4A3428" 
          stroke="#2C1810" 
          stroke-width="2"/>
    <!-- Inner border -->
    <rect x="66" y="46" width="68" height="118" 
          fill="none" 
          stroke="#5C4A3A" 
          stroke-width="1.5"/>
    
    <!-- Large parchment pinned to center panel -->
    <g>
      <rect x="72" y="55" width="56" height="80" fill="#E8DCC0" stroke="#A0826D" stroke-width="0.8" opacity="0.9"/>
      <!-- Pins at corners -->
      <circle cx="75" cy="58" r="1.5" fill="#4A4A4A"/>
      <circle cx="125" cy="58" r="1.5" fill="#4A4A4A"/>
      <!-- Reference table scribbles -->
      <line x1="76" y1="68" x2="124" y2="68" stroke="#3D2817" stroke-width="0.5" opacity="0.7"/>
      <line x1="76" y1="75" x2="122" y2="75" stroke="#3D2817" stroke-width="0.4" opacity="0.6"/>
      <line x1="76" y1="82" x2="124" y2="82" stroke="#3D2817" stroke-width="0.4" opacity="0.6"/>
      <line x1="76" y1="89" x2="120" y2="89" stroke="#3D2817" stroke-width="0.4" opacity="0.6"/>
      <line x1="76" y1="96" x2="123" y2="96" stroke="#3D2817" stroke-width="0.4" opacity="0.6"/>
      <line x1="76" y1="103" x2="121" y2="103" stroke="#3D2817" stroke-width="0.4" opacity="0.6"/>
      <!-- Vertical divider -->
      <line x1="100" y1="68" x2="100" y2="110" stroke="#3D2817" stroke-width="0.5" opacity="0.5"/>
      <!-- Quick sketch at bottom -->
      <circle cx="85" cy="120" r="4" fill="none" stroke="#3D2817" stroke-width="0.6" opacity="0.5"/>
      <path d="M 85,116 L 85,124 M 81,120 L 89,120" stroke="#3D2817" stroke-width="0.6" opacity="0.5"/>
    </g>
    
    <!-- Small sticky note -->
    <g>
      <rect x="70" y="142" width="18" height="16" fill="#F5E6D3" stroke="#A0826D" stroke-width="0.5" opacity="0.85"/>
      <circle cx="79" cy="144" r="1.2" fill="#4A4A4A"/>
      <line x1="72" y1="149" x2="84" y2="149" stroke="#3D2817" stroke-width="0.3" opacity="0.6"/>
      <line x1="72" y1="153" x2="82" y2="153" stroke="#3D2817" stroke-width="0.3" opacity="0.6"/>
    </g>
    
    <!-- Right panel (angled outward) -->
    <path d="M 140,40 L 190,50 L 190,180 L 140,170 Z" 
          fill="url(#leatherGradient)" 
          stroke="#2C1810" 
          stroke-width="2"/>
    <!-- Inner border -->
    <path d="M 142,46 L 184,54 L 184,174 L 142,166 Z" 
          fill="none" 
          stroke="#5C4A3A" 
          stroke-width="1.5"/>
    <!-- Panel details -->
    <line x1="144" y1="64" x2="182" y2="70" stroke="#3D2817" stroke-width="0.5" opacity="0.3"/>
    <line x1="144" y1="104" x2="182" y2="110" stroke="#3D2817" stroke-width="0.5" opacity="0.3"/>
    <line x1="144" y1="144" x2="182" y2="150" stroke="#3D2817" stroke-width="0.5" opacity="0.3"/>
    
    <!-- Torn parchment 1 - initiative tracker -->
    <g>
      <path d="M 148,72 L 174,76 L 173,104 L 147,100 Z" fill="#E8DCC0" stroke="#A0826D" stroke-width="0.5" opacity="0.9"/>
      <circle cx="161" cy="74" r="1.5" fill="#4A4A4A"/>
      <!-- Initiative scribbles -->
      <line x1="150" y1="82" x2="170" y2="84" stroke="#3D2817" stroke-width="0.4" opacity="0.7"/>
      <line x1="150" y1="87" x2="168" y2="89" stroke="#3D2817" stroke-width="0.4" opacity="0.6"/>
      <line x1="150" y1="92" x2="171" y2="94" stroke="#3D2817" stroke-width="0.4" opacity="0.6"/>
      <line x1="150" y1="97" x2="167" y2="99" stroke="#3D2817" stroke-width="0.4" opacity="0.6"/>
    </g>
    
    <!-- Parchment 2 - quick notes -->
    <g>
      <rect x="152" y="118" width="22" height="28" fill="#F5E6D3" stroke="#A0826D" stroke-width="0.5" opacity="0.85"/>
      <circle cx="163" cy="120" r="1.5" fill="#4A4A4A"/>
      <!-- Note scribbles -->
      <line x1="155" y1="126" x2="169" y2="126" stroke="#3D2817" stroke-width="0.4" opacity="0.6"/>
      <line x1="155" y1="131" x2="171" y2="131" stroke="#3D2817" stroke-width="0.4" opacity="0.6"/>
      <line x1="155" y1="136" x2="167" y2="136" stroke="#3D2817" stroke-width="0.4" opacity="0.6"/>
      <line x1="155" y1="141" x2="170" y2="141" stroke="#3D2817" stroke-width="0.4" opacity="0.6"/>
    </g>
    
    <!-- Hinges between panels -->
    <!-- Left hinge -->
    <rect x="58" y="55" width="4" height="8" fill="#4A4A4A" stroke="#2C1810" stroke-width="0.5"/>
    <circle cx="60" cy="59" r="1.5" fill="#2C1810"/>
    <rect x="58" y="145" width="4" height="8" fill="#4A4A4A" stroke="#2C1810" stroke-width="0.5"/>
    <circle cx="60" cy="149" r="1.5" fill="#2C1810"/>
    
    <!-- Right hinge -->
    <rect x="138" y="55" width="4" height="8" fill="#4A4A4A" stroke="#2C1810" stroke-width="0.5"/>
    <circle cx="140" cy="59" r="1.5" fill="#2C1810"/>
    <rect x="138" y="145" width="4" height="8" fill="#4A4A4A" stroke="#2C1810" stroke-width="0.5"/>
    <circle cx="140" cy="149" r="1.5" fill="#2C1810"/>
    
    <!-- Top edge detail -->
    <path d="M 10,50 L 60,40 L 140,40 L 190,50" 
          fill="none" 
          stroke="#5C4A3A" 
          stroke-width="2"/>
  </g>
  
  <!-- Tankard in front - smaller scale, positioned lower -->
  <g id="tankard" transform="translate(100, 140)">
    <!-- Shadow -->
    <ellipse cx="0" cy="50" rx="20" ry="5" fill="#000" opacity="0.3"/>
    
    <!-- Main tankard body -->
    <ellipse cx="0" cy="48" rx="18" ry="5" fill="#5C4A3A"/>
    <path d="M -18,48 L -18,10 Q -18,6 -14,6 L 14,6 Q 18,6 18,10 L 18,48" 
          fill="url(#tankardGradient)" 
          stroke="#3D2817" 
          stroke-width="2"/>
    
    <!-- Metal bands -->
    <rect x="-18" y="16" width="36" height="3" fill="url(#metalGradient)" opacity="0.8"/>
    <rect x="-18" y="32" width="36" height="3" fill="url(#metalGradient)" opacity="0.8"/>
    
    <!-- Handle -->
    <path d="M 18,18 Q 30,18 30,28 Q 30,38 18,38" 
          fill="none" 
          stroke="#6B5644" 
          stroke-width="6" 
          stroke-linecap="round"/>
    <path d="M 18,18 Q 30,18 30,28 Q 30,38 18,38" 
          fill="none" 
          stroke="#8B6F47" 
          stroke-width="3.5" 
          stroke-linecap="round"/>
    
    <!-- Metal rim -->
    <ellipse cx="0" cy="6" rx="18" ry="3" fill="url(#metalGradient)" stroke="#8B6914" stroke-width="1"/>
    
    <!-- Beer foam -->
    <ellipse cx="0" cy="5" rx="16" ry="4" fill="url(#foamGradient)"/>
    <circle cx="-6" cy="3" r="4" fill="#FFFAED" opacity="0.9"/>
    <circle cx="0" cy="1" r="5" fill="#FFFAED" opacity="0.95"/>
    <circle cx="6" cy="3" r="4" fill="#FFFAED" opacity="0.9"/>
    
    <!-- D20 on tankard -->
    <g transform="translate(0, 24)">
      <polygon points="0,-7 6,-3 6,3 0,7 -6,3 -6,-3" 
               fill="#D4AF37" 
               stroke="#B8941F" 
               stroke-width="1.5"
               opacity="0.9"/>
      <text x="0" y="3" 
            font-family="Arial, sans-serif" 
            font-size="9" 
            fill="#3D2817" 
            text-anchor="middle" 
            font-weight="bold">20</text>
    </g>
    
    <!-- Wood grain -->
    <path d="M -15,12 Q 0,12.5 15,12" stroke="#5C4A3A" stroke-width="1" opacity="0.4" fill="none"/>
    <path d="M -17,28 Q 0,28.5 17,28" stroke="#5C4A3A" stroke-width="1" opacity="0.4" fill="none"/>
    <path d="M -17,42 Q 0,42.5 17,42" stroke="#5C4A3A" stroke-width="1" opacity="0.4" fill="none"/>
    
    <!-- Highlight -->
    <ellipse cx="-8" cy="24" rx="3" ry="14" fill="white" opacity="0.15"/>
  </g>
</svg>