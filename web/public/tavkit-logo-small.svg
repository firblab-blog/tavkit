<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <defs>
    <!-- Wood/clay tankard gradient -->
    <linearGradient id="tankardGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#A0826D;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#8B6F47;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6B5644;stop-opacity:1" />
    </linearGradient>
    
    <!-- Foam gradient -->
    <radialGradient id="foamGradient">
      <stop offset="0%" style="stop-color:#FFFAED;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#F5E6D3;stop-opacity:1" />
    </radialGradient>
    
    <!-- Metal gradient -->
    <linearGradient id="metalGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#D4AF37;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#C9A428;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#B8941F;stop-opacity:1" />
    </linearGradient>
    
    <!-- DM Screen gradient -->
    <linearGradient id="leatherGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3D2817;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#4A3428;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3D2817;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  
  <!-- Simplified DM Screen -->
  <g opacity="0.7">
    <!-- Left panel -->
    <path d="M 2,10 L 14,8 L 14,36 L 2,38 Z" fill="url(#leatherGradient)" stroke="#2C1810" stroke-width="0.5"/>
    <!-- Center panel -->
    <rect x="14" y="8" width="20" height="28" fill="#4A3428" stroke="#2C1810" stroke-width="0.5"/>
    <!-- Right panel -->
    <path d="M 34,8 L 46,10 L 46,38 L 34,36 Z" fill="url(#leatherGradient)" stroke="#2C1810" stroke-width="0.5"/>
  </g>
  
  <!-- Tankard in front -->
  <g transform="translate(24, 32)">
    <!-- Body -->
    <ellipse cx="0" cy="10" rx="5" ry="1.5" fill="#5C4A3A"/>
    <path d="M -5,10 L -5,2 Q -5,0 -3,0 L 3,0 Q 5,0 5,2 L 5,10" 
          fill="url(#tankardGradient)" 
          stroke="#3D2817" 
          stroke-width="0.8"/>
    
    <!-- Metal bands -->
    <rect x="-5" y="4" width="10" height="1" fill="url(#metalGradient)" opacity="0.8"/>
    <rect x="-5" y="7" width="10" height="1" fill="url(#metalGradient)" opacity="0.8"/>
    
    <!-- Handle -->
    <path d="M 5,4 Q 8,4 8,6.5 Q 8,9 5,9" 
          fill="none" 
          stroke="#6B5644" 
          stroke-width="1.8" 
          stroke-linecap="round"/>
    <path d="M 5,4 Q 8,4 8,6.5 Q 8,9 5,9" 
          fill="none" 
          stroke="#8B6F47" 
          stroke-width="1" 
          stroke-linecap="round"/>
    
    <!-- Rim -->
    <ellipse cx="0" cy="0" rx="5" ry="1" fill="url(#metalGradient)"/>
    
    <!-- Foam -->
    <ellipse cx="0" cy="-0.5" rx="4.5" ry="1.2" fill="url(#foamGradient)"/>
    <circle cx="-1.5" cy="-1" r="1.2" fill="#FFFAED" opacity="0.9"/>
    <circle cx="0" cy="-1.5" r="1.5" fill="#FFFAED" opacity="0.95"/>
    <circle cx="1.5" cy="-1" r="1.2" fill="#FFFAED" opacity="0.9"/>
    
    <!-- D20 -->
    <g transform="translate(0, 5.5)">
      <polygon points="0,-2 1.5,-0.5 1.5,0.5 0,2 -1.5,0.5 -1.5,-0.5" 
               fill="#D4AF37" 
               stroke="#B8941F" 
               stroke-width="0.4"
               opacity="0.9"/>
      <text x="0" y="0.8" 
            font-family="Arial, sans-serif" 
            font-size="2.5" 
            fill="#3D2817" 
            text-anchor="middle" 
            font-weight="bold">20</text>
    </g>
  </g>
</svg>