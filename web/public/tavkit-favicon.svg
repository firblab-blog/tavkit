<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <!-- Tankard gradient -->
    <linearGradient id="tankardGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#A0826D;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6B5644;stop-opacity:1" />
    </linearGradient>
    
    <!-- Foam gradient -->
    <radialGradient id="foamGradient">
      <stop offset="0%" style="stop-color:#FFFAED;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#F5E6D3;stop-opacity:1" />
    </radialGradient>
  </defs>
  
  
  <!-- Very simplified DM screen silhouette -->
  <path d="M 4,8 L 10,7 L 10,25 L 4,26 Z" fill="#3D2817" opacity="0.6"/>
  <rect x="10" y="7" width="12" height="18" fill="#4A3428" opacity="0.6"/>
  <path d="M 22,7 L 28,8 L 28,26 L 22,25 Z" fill="#3D2817" opacity="0.6"/>
  
  <!-- Tankard - main focus -->
  <g transform="translate(16, 20)">
    <!-- Body -->
    <ellipse cx="0" cy="6" rx="4" ry="1.2" fill="#5C4A3A"/>
    <path d="M -4,6 L -4,1 Q -4,0 -2.5,0 L 2.5,0 Q 4,0 4,1 L 4,6" 
          fill="url(#tankardGradient)" 
          stroke="#3D2817" 
          stroke-width="0.6"/>
    
    <!-- Handle -->
    <path d="M 4,2.5 Q 6,2.5 6,4 Q 6,5.5 4,5.5" 
          fill="none" 
          stroke="#8B6F47" 
          stroke-width="1.2" 
          stroke-linecap="round"/>
    
    <!-- Foam -->
    <ellipse cx="0" cy="0" rx="4" ry="1" fill="url(#foamGradient)"/>
    <circle cx="0" cy="-1" r="1.5" fill="#FFFAED" opacity="0.9"/>
    <circle cx="-1.2" cy="-0.5" r="1" fill="#FFF" opacity="0.8"/>
    <circle cx="1.2" cy="-0.5" r="1" fill="#FFF" opacity="0.8"/>
    
    <!-- Gold band accent -->
    <rect x="-4" y="3" width="8" height="0.8" fill="#D4AF37" opacity="0.7"/>
  </g>
</svg>