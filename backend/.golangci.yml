# golangci-lint configuration for TavKit backend
# See https://golangci-lint.run/usage/configuration/

version: 2

run:
  timeout: 5m
  tests: true
  build-tags:
    - integration

linters:
  enable:
    - errcheck       # Check for unchecked errors
    - govet          # Reports suspicious constructs
    - ineffassign    # Detect ineffectual assignments
    - staticcheck    # Advanced Go linter
    - unused         # Check for unused constants, variables, functions, types
    - misspell       # Find commonly misspelled words
    - goconst        # Find repeated strings that could be constants
    - gocyclo        # Check cyclomatic complexity
    - dupl           # Check for duplicate code
    - gosec          # Security issues
    - unconvert      # Remove unnecessary type conversions
    - nilerr         # Find code that returns nil even if it checks err != nil
    - predeclared    # Find code using predeclared identifiers
  disable:
    - exhaustive     # Too strict for MVP
    - exhaustruct    # Too strict for MVP
    - gochecknoglobals # We use some globals
    - gochecknoinits  # Init functions are sometimes needed
    - godox          # Allow TODO/FIXME/BUG comments
    - revive         # 127 documentation comments - will be addressed in future PR

linters-settings:
  errcheck:
    check-type-assertions: true
    check-blank: true
    
  govet:
    enable-all: true
    
  gocyclo:
    min-complexity: 15
    
  dupl:
    threshold: 100
    
  goconst:
    min-len: 3
    min-occurrences: 3
    
  misspell:
    locale: US
    
  revive:
    severity: warning
    confidence: 0.8
    enable-all-rules: false
    rules:
      - name: blank-imports
      - name: context-as-argument
      - name: context-keys-type
      - name: dot-imports
      - name: error-return
      - name: error-strings
      - name: error-naming
      - name: if-return
      - name: increment-decrement
      - name: var-naming
      - name: var-declaration
      - name: package-comments
      - name: range
      - name: receiver-naming
      - name: time-naming
      - name: unexported-return
      - name: indent-error-flow
      - name: errorf
      - name: empty-block
      - name: superfluous-else
      - name: unused-parameter
      - name: unreachable-code
      - name: redefines-builtin-id
      # Disabled rules - will be addressed in future PR
      # - name: exported  # 127 missing comments - deferred for documentation pass
      
  stylecheck:
    checks: ["all", "-ST1000", "-ST1003"]
    
  gosec:
    excludes:
      - G104  # Audit errors not checked (covered by errcheck)
      - G306  # Poor file permissions (we handle this explicitly)

issues:
  exclude-use-default: false
  max-issues-per-linter: 0
  max-same-issues: 0
  uniq-by-line: true
  exclude-dirs:
    - vendor
    - tmp
  exclude-files:
    - ".*\\.pb\\.go$"
  
  exclude-rules:
    # Exclude some linters from running on tests
    - path: _test\.go
      linters:
        - gocyclo
        - errcheck
        - dupl
        - gosec
        - goconst
    
    # Temporarily ignore exported documentation comments - will be addressed in future PR
    - linters:
        - revive
      text: "^exported:"
    
    # Temporarily ignore comment format and unused parameter warnings
    - linters:
        - revive
      text: "comment on exported.*should be of the form"
    
    - linters:
        - revive
      text: "unused-parameter"
    
    # Ignore blank import warning for sqlite driver
    - linters:
        - revive
      text: "blank-imports"
      path: "internal/db/sqlite.go"
    
    # Ignore long lines for function signatures
    - linters:
        - lll
      source: "^func "
      
    # Ignore complexity in main.go for setup
    - path: cmd/.*main\.go
      linters:
        - gocyclo
        
  # Show all issues
  new: false

output:
  print-issued-lines: true
  print-linter-name: true
  sort-results: true

